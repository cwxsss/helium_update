MarkdownMsg = """
### Notes

---

* Helium is downloaded from [imputnet/helium-windows](https://github.com/imputnet/helium-windows), using the Windows x64 full installer.
* Helium++ is downloaded from [cwxsss/helium_plus](https://github.com/cwxsss/helium_plus) as `version.dll.new` next to `chrome.exe`.
* Close Helium and this updater, then replace `version.dll` manually with `version.dll.new`. The updater never changes `chrome++.ini`.
* Point the directory to the `Application` folder that contains `chrome.exe`; for a first install, choose an empty folder and the updater will create a portable layout."""
